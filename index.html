<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#131215" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bodeguilla" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>La Bodeguilla</title>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div>
      <div class="header-title">La Bodeguilla</div>
      <div class="header-sub">PEÑA EL CHUNGAZO</div>
    </div>
    <div class="header-right" id="header-badges"></div>
  </header>

  <!-- CONTENT -->
  <div class="content">

    <!-- ALACENA -->
    <div class="tab-panel active" id="panel-visual">
      <div class="resumen-bar">
        <div class="resumen-item"><div class="resumen-num" id="res-total">—</div><div class="resumen-lbl">ARTICULOS</div></div>
        <div class="resumen-divider"></div>
        <div class="resumen-item"><div class="resumen-num" id="res-alerta" style="color:var(--danger)">—</div><div class="resumen-lbl">EN ALERTA</div></div>
        <div class="resumen-divider"></div>
        <div class="resumen-item"><div class="resumen-num" id="res-bien" style="color:var(--success)">—</div><div class="resumen-lbl">BIEN</div></div>
      </div>
      <div class="filter-bar" id="filter-bar"></div>
      <div class="pad" id="lista-productos" style="flex:1;overflow-y:auto"></div>
    </div>

    <!-- RECUENTO -->
    <div class="tab-panel" id="panel-recuento">
      <div class="recuento-banner">Escribe cuanto queda de cada cosa.</div>
      <div style="flex:1;overflow-y:auto" id="lista-recuento" class="pad"></div>
      <div class="recuento-save-bar">
        <button class="btn btn-primary" onclick="guardarRecuento()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          GUARDAR RECUENTO
        </button>
      </div>
    </div>

    <!-- COMPRA -->
    <div class="tab-panel" id="panel-compra" style="overflow-y:auto">
      <div class="pad">
        <button class="btn-cuentas" onclick="abrirCuentas()">
          <div class="btn-cuentas-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
            CUENTAS DE LA PEÑA
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--accent)"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <div class="form-card">
          <span class="section-label">QUE HAY QUE COMPRAR</span>
          <input class="input" id="input-nombre-compra" placeholder="Ej: Coca-Cola 2L, Ron Dyc..." />
          <label class="field-label">Cantidad</label>
          <div class="qty-row">
            <button class="btn-qty" onclick="cambiarCantidad(-1)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <span class="qty-num" id="qty-num">1</span>
            <button class="btn-qty" onclick="cambiarCantidad(1)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <div class="field-row">
            <label class="field-label" style="margin:0">Donde se compra</label>
            <button class="config-link" onclick="toggleGestTiendas()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
              Gestionar sitios
            </button>
          </div>
          <div id="gest-tiendas" style="display:none" class="tienda-box">
            <div class="tienda-mini-form">
              <input class="mini-input" id="nueva-tienda-input" placeholder="Nuevo sitio..." />
              <button class="btn-icon accent" onclick="registrarTienda()" style="padding:9px">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>
              </button>
            </div>
            <span class="tienda-lista-label">SITIOS GUARDADOS</span>
            <div id="lista-tiendas-gestion"></div>
          </div>
          <div class="chip-row" id="chips-tiendas"></div>
          <button class="btn btn-primary" onclick="anadirALaCompra()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            APUNTAR EN LA LISTA
          </button>
        </div>
        <div id="lista-compra"></div>
        <div class="spacer-40"></div>
      </div>
    </div>

    <!-- GESTION -->
    <div class="tab-panel" id="panel-gestion" style="overflow-y:auto">
      <div class="pad">
        <div class="form-card">
          <span class="section-label">NUEVO ARTICULO</span>
          <label class="field-label">Nombre</label>
          <input class="input" id="nuevo-prod-nombre" placeholder="Ej: Fanta Naranja 2L" />
          <label class="field-label">Categoria</label>
          <div class="chip-row" id="chips-cat-nuevo"></div>
          <div class="toggle-row" onclick="toggleMinimo('nuevo')">
            <div class="toggle-box on" id="toggle-nuevo"><div class="toggle-dot"></div></div>
            <span class="toggle-lbl" id="toggle-nuevo-lbl">Tiene stock minimo</span>
          </div>
          <div id="campo-minimo-nuevo">
            <label class="field-label">Stock minimo</label>
            <input class="input" id="nuevo-prod-minimo" type="number" placeholder="Ej: 2" value="2" />
          </div>
          <button class="btn btn-success" onclick="registrarProducto()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            REGISTRAR
          </button>
        </div>
        <div class="form-card">
          <span class="section-label">ARTICULOS EXISTENTES</span>
          <div id="lista-gestion"></div>
        </div>
        <div class="spacer-40"></div>
      </div>
    </div>

    <!-- CASINO -->
    <div class="tab-panel" id="panel-casino">
      <div id="casino-root"></div>
    </div>

  </div><!-- /content -->

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="visual" onclick="cambiarTab('visual')">
      <!-- Estantería / alacena -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="5" rx="1"/><rect x="2" y="10" width="20" height="5" rx="1"/><rect x="2" y="17" width="20" height="5" rx="1"/>
        <line x1="6" y1="3" x2="6" y2="8"/><line x1="6" y1="10" x2="6" y2="15"/><line x1="6" y1="17" x2="6" y2="22"/>
      </svg>
      Alacena
    </button>
    <button class="tab-btn" data-tab="recuento" onclick="cambiarTab('recuento')">
      <!-- Lápiz + lista -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      Recuento
    </button>
    <button class="tab-btn" data-tab="compra" onclick="cambiarTab('compra')">
      <!-- Carrito de la compra -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Compra
    </button>
    <button class="tab-btn" data-tab="gestion" onclick="cambiarTab('gestion')">
      <!-- Tuerca / configuración -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Gestion
    </button>
    <button class="tab-btn" data-tab="casino" onclick="cambiarTab('casino')">
      <!-- Dado -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="3"/>
        <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
        <circle cx="16" cy="8" r="1.2" fill="currentColor"/>
        <circle cx="8" cy="16" r="1.2" fill="currentColor"/>
        <circle cx="16" cy="16" r="1.2" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
      </svg>
      Casino
    </button>
  </nav>

</div><!-- /app -->

<!-- MODAL EDICION PRODUCTO -->
<div class="modal-overlay" id="modal-edicion">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-titulo">EDITAR ARTICULO</span>
      <button class="btn-icon" onclick="cerrarModalEdicion()" style="background:transparent;border:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--textMuted)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <label class="field-label">Nombre</label>
    <input class="input" id="modal-nombre" />
    <label class="field-label">Categoria</label>
    <div class="chip-row" id="chips-cat-modal"></div>
    <div class="toggle-row" onclick="toggleMinimo('modal')">
      <div class="toggle-box on" id="toggle-modal"><div class="toggle-dot"></div></div>
      <span class="toggle-lbl" id="toggle-modal-lbl">Tiene stock minimo</span>
    </div>
    <div id="campo-minimo-modal">
      <label class="field-label">Stock minimo</label>
      <input class="input" id="modal-minimo" type="number" />
    </div>
    <button class="btn btn-primary" onclick="guardarEdicion()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>
      GUARDAR CAMBIOS
    </button>
  </div>
</div>

<!-- PANEL CUENTAS -->
<div class="panel-full" id="panel-cuentas"></div>

<!-- PANEL EVENTOS -->
<div class="panel-full" id="panel-eventos"></div>

<script type="module" src="app.js"></script>
<script type="module" src="casino.js"></script>
<script type="module" src="cuentas.js"></script>
<script type="module" src="eventos.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
